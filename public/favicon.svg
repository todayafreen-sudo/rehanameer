  <rect x="22" y="6" width="6" height="4" rx="1.5" fill="#ffffff" opacity="0.35" />
  <rect x="36" y="6" width="6" height="4" rx="1.5" fill="#ffffff" opacity="0.35" />
  <rect x="48" y="6" width="6" height="4" rx="1.5" fill="#ffffff" opacity="0.35" />
  
  <rect x="10" y="54" width="6" height="4" rx="1.5" fill="#ffffff" opacity="0.35" />
  <rect x="22" y="54" width="6" height="4" rx="1.5" fill="#ffffff" opacity="0.35" />
  <rect x="36" y="54" width="6" height="4" rx="1.5" fill="#ffffff" opacity="0.35" />
  <rect x="48" y="54" width="6" height="4" rx="1.5" fill="#ffffff" opacity="0.35" />

  <!-- Bold Central 'M' Path with Cinematic Geometry -->
  <path d="M 16 46 L 16 18 L 26 18 L 32 30 L 38 18 L 48 18 L 48 46 L 41 46 L 41 27 L 35 38 L 29 38 L 23 27 L 23 46 Z" fill="#ffffff" filter="url(#shadow)" />
  
